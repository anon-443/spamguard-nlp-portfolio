[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamguard-nlp"
version = "0.1.0"
description = "Duplicate-aware SMS spam classification with lexical baselines, transformer comparison, and FastAPI inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
transformer = ["transformers>=4.46,<5", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
spamguard-train = "spamguard.train:main"
spamguard-download-data = "spamguard.data:main"
spamguard-api = "spamguard.api:main"
spamguard-train-transformer = "spamguard.train_transformer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
